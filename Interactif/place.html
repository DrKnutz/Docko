  <div id="overlayPopup">

    <div class="overlay-container">

      <button class="popup-close" onclick="closeOverlay()">✕</button>

      <div class="film-overlay">

        <div class="film-left">
          <img id="poster">

          <div class="film-tags">
            <h3>Tags</h3>
            <span class="tag">Pop-culture</span>
            <span class="tag">Social</span>
            <span class="tag">Histoire</span>
          </div>
        </div>

        <div class="film-right">

          <h1 id="Titre"></h1>
          <h2 id="Titre_Kr"></h2>

          <div class="film-details">
            <span id="Time"></span>
            <span id="Date"></span>
          </div>

          <div class="film-synopsis">
            <p id="Description"></p>
          </div>

          <div class="film-watch">
            <a id="watchLink" target="_blank" class="btn-watch">
              Cliquez ici pour regarder le documentaire
            </a>
          </div>

          <div class="film-team">
            <h3>Équipe</h3>

            <ul class="team-list" id="Equipe">
         
            </ul>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    //Script overlay//

    function ouvrirPopup(titre, texte) {

      document.getElementById("overlayPopup").style.display = "flex";

      document.getElementById("popupTitle").textContent = titre;
      document.getElementById("popupText").textContent = texte;

    }

    function closeOverlay() {

      document.getElementById("overlayPopup").style.display = "none";

    }


  </script>
