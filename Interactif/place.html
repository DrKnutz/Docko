  <!-- Hors du conteneur zoomé pour rester fixes à l'écran -->
  <img id="gif-transition" src="" class="no-interaction hidden"
       style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:9998;">
  <div id="fondu-noir"
       style="position:fixed;inset:0;background:black;opacity:0;pointer-events:none;z-index:9997;transition:opacity 0.4s ease;"></div>

  <!-- ======= POPUP ======= -->
  <div id="overlayPopup">
    <div class="overlay-container">
      <button class="popup-close" onclick="closeOverlay()">✕</button>
      <div class="film-overlay">

        <div class="film-left">
          <img id="poster">
          <div class="film-tags">
            <h3>Tags</h3>
            <span class="tag">Pop-culture</span>
            <span class="tag">Social</span>
            <span class="tag">Histoire</span>
          </div>
        </div>

        <div class="film-right">
          <h1 id="Titre"></h1>
          <h2 id="Titre_Kr"></h2>
          <div class="film-details">
            <span id="Time"></span> • <span id="Date"></span>
          </div>
          <div class="film-synopsis">
            <p id="Description"></p>
          </div>
          <div class="film-watch">
            <a id="watchLink" target="_blank" class="btn-watch">Cliquez ici pour regarder le documentaire</a>
          </div>
          <div class="film-team">
            <h3>Équipe</h3>
            <ul class="team-list" id="Equipe"></ul>
          </div>
        </div>

      </div>
    </div>
