<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>DocKo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="film.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="script.js" defer></script>

</head>

<body>

    <header id="main-header">

        <div class="logo">
            <a href="catalogue.html">
                <img src="../docko_logo_blanc.png" alt="Logo DocKo">
            </a>
        </div>

        <nav>
            <ul>
                <li><a href="catalogue.html">Accueil</a></li>
                <li><a href="categories.html">Catégories</a></li>
                <li><a href="liste-complete.html">Liste complète</a></li>
                <li><a href="a-propos.html">À propos</a></li>
            </ul>
        </nav>

        <div class="search">
            <input type="text" placeholder="Rechercher...">
        </div>

    </header>

<!-- SECTION PRINCIPALE -->

    <section class="film-page">

        <div class="film-left">
            <img id="poster">
            <div class="film-tags">
                <h3>Tags</h3>
                <span class="tag">Pop-culture</span>
                <span class="tag">Social</span>
                <span class="tag">Histoire</span>
            </div>
        </div>

        <div class="film-right">

            <h1 id="Titre"></h1>
            <h2 id="Titre_Kr"></h2>

            <div class="film-details">
                <span id="Time"></span>
                    •
                <span id="Date"></span>
                
                <div class="film-watch">
                <a id="watchLink" target="_blank"class="btn-watch">
                   ▶ Accéder au documentaire
                </a>
                
            </div>
            </div>

            <div class="film-synopsis">
                <p id="Description">

                </p>
                
                <ul class="team-list" id="Equipe"></ul>

            </div>

        </div>

    </section>

   <footer>
        <div class="footer-logos">
            <img src="../logos_blanc.png" alt="">
        </div>

        <div class="mentions">
            <p>© 2026 DocKo — Tous droits réservés</p>
            <p>
                <a href="mentions-legales.html">
                    Mentions légales | Politique de confidentialité | Contact
                </a>
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
